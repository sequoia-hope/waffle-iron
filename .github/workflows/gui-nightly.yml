name: GUI nightly

# Every GUI spec file that no per-push job runs (`scripts/test.sh gui-rest`:
# the spec files in neither gui-fast nor gui-relay; the list is computed, so
# a new spec file is covered here until someone moves it to a per-push tier).
#
# Nothing ran these files, and by 2026-11-12 they had 47 failures: mostly
# tests gone stale, and behind them five real app bugs (orbit about the
# cursor wired to the wrong mouse button, datum-plane borders picked as body
# edges, among them). A tier nobody runs stops meaning anything.
#
# Nightly and on demand, not per push: about 970 tests, an hour and a half of
# runner time. Nothing gates on it. A red run is a regression to look at the
# next morning: the tier was green on the dev machine when this was added.
#
# Left out: the two pixel-baseline specs (GUI_SKIP_MACHINE_BASELINES). Their
# PNGs only match the machine that rendered them (fonts), so they run on the
# dev machine in gui-full, not here.
#
# Like gui-tests.yml this runs against the COMMITTED WASM bundle in
# app/static/pkg/, so it needs no Rust toolchain.

on:
  schedule:
    - cron: '43 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app

      # Four workers on the four-core runner, as in gui-tests.yml. The `list`
      # reporter names every test, so a timed-out shard still leaves a record
      # of how far it got.
      - name: gui-rest tier
        run: ./scripts/test.sh gui-rest
        env:
          TEST_THREADS: 4
          PW_SHARD: ${{ matrix.shard }}
          PW_REPORTER: list
          GUI_SKIP_MACHINE_BASELINES: '1'
          # One retry, here only. About once per run a test spends its whole
          # 60 s "setting up context" (browser.newContext stalls) and passes
          # when run again; the cause is not found. Playwright reports a
          # retried pass as "flaky" in the log, so it stays visible, and a
          # test that fails twice still fails the shard.
          PW_RETRIES: '1'

      - name: Upload traces and screenshots of failures
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-results-${{ strategy.job-index }}
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 7
