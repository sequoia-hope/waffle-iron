name: Rust lint

# Gates fmt + clippy so the hygiene debt cleared in PRs leading up to M2 can't
# silently creep back.
#
# Scope: every crate that ships in the deployed WASM bundle, plus the two dev
# sidecar oracles. The only workspace crates NOT gated are test-harness and
# predicate-gen — dev tooling that ships nothing. The job name is deliberately
# generic so it survives the list growing: it was twice renamed to track scope
# (2026-08-13) before landing here. Add new crates to env.LINT_CRATES.
#
# Lint only (fmt --check + clippy -D warnings). Tests are not run here: the
# sidecar crates' integration tests need the external C++ binaries, which aren't
# present on the runner (they self-skip). See scripts/build_sidecars.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The same crate list for both steps. cherchi-sidecar-rs is pure Rust (it only
  # shells out at test-runtime). indirect-predicates-sidecar-rs builds a C++ stub
  # via cc+bindgen when the upstream source is absent (the CI case), so it needs
  # a C toolchain + libclang — installed below.
  #
  # Beyond the kernel crates this now covers every remaining crate that ships in
  # the deployed WASM bundle (see scripts/wasm-fingerprint.sh). Each was ungated
  # long enough to drift — sketch-solver had 19 rustfmt diffs and 7 clippy
  # warnings, and the six added on 2026-08-13 carried 16 more between them,
  # including a test gated on a `native-solver` feature that no crate defines
  # (so it had never once compiled). Cleared in the commits that added them.
  #
  # NOTE: clippy/fmt see a package's code only under the features enabled for
  # THIS invocation. waffle-types' `mock-kernel` module is dark unless something
  # in the list turns it on (file-format's dev-dependency does) — measuring a
  # crate alone can therefore understate its debt, as it did here.
  LINT_CRATES: >-
    -p cad-primitives
    -p cherchi-rs
    -p ssi-rs
    -p yang-rs
    -p kernel-v2
    -p cherchi-sidecar-rs
    -p indirect-predicates-sidecar-rs
    -p sketch-solver
    -p waffle-types
    -p wasm-bridge
    -p feature-engine
    -p modeling-ops
    -p file-format
    -p step-import

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clippy + rustfmt + libclang
        run: |
          rustup component add clippy rustfmt
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: rustfmt --check
        run: cargo fmt --check ${{ env.LINT_CRATES }}

      - name: clippy -D warnings
        run: cargo clippy --all-targets ${{ env.LINT_CRATES }} -- -D warnings

      # `Instant::now`/`SystemTime::now` compile fine for wasm32 but PANIC at
      # runtime ("time not implemented") — an unconditional call in the #173
      # detector crashed every boolean in the deployed app (2026-07-22). Any
      # clock read in a wasm-reachable crate must be provably unreachable in
      # wasm (e.g. behind an env-var gate, which is always unset there) and
      # carry a `wasm-ok:` marker on the same line.
      - name: wasm clock-call guard
        run: |
          hits=$(grep -rn "Instant::now()\|SystemTime::now()" \
            crates/cad-primitives/src crates/cherchi-rs/src crates/ssi-rs/src \
            crates/yang-rs/src crates/kernel-v2/src crates/wasm-bridge/src \
            crates/waffle-types/src crates/feature-engine/src \
            crates/modeling-ops/src crates/file-format/src \
            crates/sketch-solver/src crates/step-import/src 2>/dev/null \
            | grep -v "wasm-ok:" || true)
          if [ -n "$hits" ]; then
            echo "Unmarked clock calls in wasm-reachable crates (panics at runtime in wasm):"
            echo "$hits"
            exit 1
          fi
