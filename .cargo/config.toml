# WASM target configuration:
# stack-size=4194304: Increase from default 1MB to 4MB headroom for the
# kernel-v2/yang-rs/cherchi-rs exact-arithmetic recursion depth.
#
# (The former panic=unwind flag — which forced the nightly + -Zbuild-std
# two-step build so catch_unwind could survive legacy-kernel panics — was
# removed at the Phase 6 migration: the kernel-v2 stack is Result-based and
# builds with standard stable wasm-pack.)
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-args=-z stack-size=4194304"]
