[package]
name = "waffle-types"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
i_overlay = { version = "4.4", default-features = false }

[features]
# MockKernel test double — keep out of production/WASM builds.
mock-kernel = []

[dev-dependencies]
serde_json = "1"
