[package]
name = "cherchi-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust port of Cherchi 2020 + 2022 (mesh arrangements + interactive booleans). Mesh in, labeled mesh out. No B-Rep."

# Strict layering: cherchi-rs sits directly above cad-primitives. It does NOT
# depend on yang-rs, ssi-rs, kernel-v2, or any crate from the old kernel tree.
#
# No features (PR-CR-M7c): the former `indirect-predicates` feature gated the
# LGPL C++ FFI sidecar during M6 development. M7 clean-roomed the indirect
# predicates into `src/predicates/indirect/` (pure Rust, WASM-clean), so the
# whole crate — arrangement, labeling, native boolean — now compiles
# unconditionally, including for wasm32-unknown-unknown.

[dependencies]
cad-primitives = { path = "../cad-primitives" }
dashu = "0.4"                 # Exact arithmetic backend (pure-Rust, WASM-compatible)
geometry-predicates = "0.3"   # Shewchuk-style exact orient2d / orient3d / etc.
spade = "2"                   # Constrained Delaunay triangulation (CDT) for planar
                              # face tessellation. Pure-Rust, WASM-clean: exact
                              # orientation/in-circle predicates via `robust`
                              # (Shewchuk adaptive), fixed-seed `foldhash` — no
                              # threads / rand / system time, so insertion order
                              # (caller's array order) makes it deterministic.

[dev-dependencies]
# DEV-ONLY differential oracle (PR-CR-M7c): the LGPL C++ FFI shim for
# indirect/implicit-point predicates. NO LONGER a production dependency — the
# clean-room native predicates (`src/predicates/indirect/`) replaced it in
# every production call path at M7c. It remains strictly as the black-box
# differential oracle for `tests/indirect_ffi_parity.rs`,
# `tests/indirect_catalog_ffi_parity.rs`, and the in-src `#[cfg(test)]`
# exactness oracles. Not WASM-compatible (native-only `compile_error!`) —
# fine for a dev-dependency: `cargo check --target wasm32-unknown-unknown`
# does not build test targets.
indirect-predicates-sidecar-rs = { path = "../indirect-predicates-sidecar-rs" }
# Reference parity tests: differential diff against the upstream C++ sidecar
# at /home/claude/cherchi2022/InteractiveAndRobustMeshBooleans/ — see
# docs/sidecar/cherchi2022_build_guide.md.
#
# Dev-dep CYCLE on purpose (Cargo allows it): cherchi-sidecar-rs depends on
# cherchi-rs for `Mesh` + `MeshBoolean`, and cherchi-rs dev-depends back on it
# so `tests/parity_native_vs_sidecar.rs` can diff `NativeBoolean` against the
# wrapped C++ `mesh_booleans` reference (the M6 correctness oracle).
cherchi-sidecar-rs = { path = "../cherchi-sidecar-rs" }
