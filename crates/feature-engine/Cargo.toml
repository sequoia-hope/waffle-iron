[package]
name = "feature-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
modeling-ops = { path = "../modeling-ops" }
sketch-solver = { path = "../sketch-solver" }
step-import = { path = "../step-import" }
waffle-types = { path = "../waffle-types" }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
waffle-types = { path = "../waffle-types", features = ["mock-kernel"] }
