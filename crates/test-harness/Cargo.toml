[package]
name = "test-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
kernel = { path = "../kernel" }
kernel-v2 = { path = "../kernel-v2" }
cad-primitives = { path = "../cad-primitives" }
feature-engine = { path = "../feature-engine" }
modeling-ops = { path = "../modeling-ops" }
wasm-bridge = { path = "../wasm-bridge" }
waffle-types = { path = "../waffle-types", features = ["mock-kernel"] }
file-format = { path = "../file-format" }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
proptest = "1.6"
i_overlay = { version = "4.4", default-features = false }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[[bin]]
name = "assay_gen"
path = "src/bin/assay_gen.rs"
