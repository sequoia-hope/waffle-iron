[package]
name = "test-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# `strict-validation` compiles kernel-v2's debug-tier geometric tripwires
# (loop vertices on their face's analytic surface) into the OPTIMIZED build the
# assay runs. Without it a `--release` corpus verdict cannot see an off-surface
# loop vertex at all — the ledger's SUPPORTED_CORRECT was blind to it.
kernel-v2 = { path = "../kernel-v2", features = ["strict-validation"] }
cad-primitives = { path = "../cad-primitives" }
feature-engine = { path = "../feature-engine" }
modeling-ops = { path = "../modeling-ops" }
wasm-bridge = { path = "../wasm-bridge" }
waffle-types = { path = "../waffle-types", features = ["mock-kernel"] }
file-format = { path = "../file-format" }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
proptest = "1.6"
i_overlay = { version = "4.4", default-features = false }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# S4 sketch rank oracle (`src/sketch_rank.rs`): an SVD of a FINITE-DIFFERENCE
# constraint Jacobian, deliberately different algebra from sketch-solver's
# column-pivoted QR of an analytic one. Pinned to the solver's own nalgebra
# version so the workspace resolves a single copy.
nalgebra = "0.34"

[dev-dependencies]
tempfile = "3"
# S4 differential test (`tests/sketch_rank_oracle.rs`): the subject under test.
# Dev-only, and only the TEST depends on it — `src/sketch_rank.rs` never calls
# the solver, which is what keeps the oracle independent.
sketch-solver = { path = "../sketch-solver" }
libc = "0.2"
# M8 Stage-0 operand diagnosis (spec m8_stage0_inputcheck_clean_emission §6):
# the native five-axiom census + the sidecar inputcheck harness. Dev-only —
# production code must not depend on either from here.
cherchi-rs = { path = "../cherchi-rs" }
cherchi-sidecar-rs = { path = "../cherchi-sidecar-rs" }
# External-corpus probe (tests/abc_probe.rs): import a real-world STEP model
# and push its welded mesh through the native boolean. Dev-only.
step-import = { path = "../step-import" }

[[bin]]
name = "assay_gen"
path = "src/bin/assay_gen.rs"
