[package]
name = "file-format"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
feature-engine = { path = "../feature-engine" }
modeling-ops = { path = "../modeling-ops" }
waffle-types = { path = "../waffle-types" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: exact (correctly rounded) float parsing, so a load →
# save cycle never drifts a coordinate by an ULP. Without it serde_json's
# best-effort parser turned `-4.4087284769304716e-17` into
# `-4.408728476930472e-17` on every round trip (measured on the assay corpus,
# C0028). Feature unification applies it to every crate in the build.
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
sha1 = "0.10"
step-import = { path = "../step-import" }
schemars = { version = "1.2", features = ["uuid1", "chrono04"], optional = true }

[features]
# JSON Schema of the `.waffle` v5 file (`docs/schema/waffle-v5.schema.json`),
# generated from the Rust types and pinned by `tests/schema_golden.rs`.
# Off by default; enable with `--features json-schema`.
json-schema = ["dep:schemars", "feature-engine/json-schema", "waffle-types/json-schema"]

[dev-dependencies]
waffle-types = { path = "../waffle-types", features = ["mock-kernel"] }
# Validates every repo .waffle file against the generated schema
# (tests/schema_golden.rs, `json-schema` feature). No network resolvers.
jsonschema = { version = "0.55", default-features = false }
# The shipped examples are stored gzipped; the corpus pins inflate them
# rather than dropping them from the walk (FEATURE_NOTES §6).
flate2 = "1"
