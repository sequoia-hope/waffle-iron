[package]
name = "cad-primitives"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared geometric primitive types and constants for the clean-sheet kernel rewrite. Types only — no algorithms."

# DISCIPLINE: this crate has ZERO workspace dependencies. It is the
# foundation everyone else depends on. Adding a workspace dep here would
# create a dependency cycle. Keep it ruthlessly small.
[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
