[package]
name = "indirect-predicates-sidecar-rs"
version = "0.1.0"
edition = "2021"
description = "FFI sidecar for Marco Attene's Indirect_Predicates (LGPL-2.1). NOT WASM-compatible. Compiles a thin C++ shim against the upstream header-only library; bindgen produces Rust FFI for a pure-C wrapper. Sits at the bottom of the dependency stack; downstream consumer is cherchi-rs Stage 2."
license = "MIT"

# Strict layering: no workspace runtime deps. This crate is at the
# bottom of the stack. Build-time deps only: cc (C++ compilation) +
# bindgen (Rust FFI generation from src/wrapper.h).
[dependencies]

[build-dependencies]
cc = "1"
bindgen = "0.69"
