[package]
name = "yang-rs"
version = "0.1.0"
edition = "2021"
description = "Yang 2025 hybrid B-Rep / mesh boolean pipeline. Stage 0 coplanar preprocessing through Stage 5/6 B-Rep reassembly."

# Strict layering: yang-rs sits above cherchi-rs and ssi-rs, below kernel-v2.
# Does NOT depend on kernel-v2 (uses its own B-Rep input/output types) and
# does NOT depend on the old kernel crate at all.
[dependencies]
cad-primitives = { path = "../cad-primitives" }
cherchi-rs = { path = "../cherchi-rs" }
ssi-rs = { path = "../ssi-rs" }

[dev-dependencies]
# Sidecar backend used by tests/end_to_end.rs for real-subprocess
# integration testing. Not a regular dep because production yang-rs
# consumers pick their own backend via the MeshBoolean trait; the
# sidecar is just today's testing default.
cherchi-sidecar-rs = { path = "../cherchi-sidecar-rs" }
