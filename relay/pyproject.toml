[project]
name = "waffle-mcp-relay"
version = "0.0.1"
description = "MCP stdio server that relays tool calls to a paired Waffle Iron browser tab over a local WebSocket"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.20",
    "mcp>=1.20",
    "websockets>=15",
]

[project.scripts]
waffle-mcp-relay = "waffle_mcp_relay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waffle_mcp_relay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Test drivers take explicit per-step timeouts; asyncio.timeout blocks would only add nesting.
"tests/**" = ["ASYNC109"]
