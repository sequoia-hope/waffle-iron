[workspace]
members = [
    "crates/waffle-types",
    "crates/kernel",
    "crates/sketch-solver",
    "crates/modeling-ops",
    "crates/feature-engine",
    "crates/wasm-bridge",
    "crates/file-format",
    "crates/test-harness",
]
exclude = ["archive"]
resolver = "2"

# Use panic=unwind so catch_unwind works on NATIVE targets.
# See .cargo/config.toml for WASM-specific settings.
[profile.release]
panic = "unwind"
