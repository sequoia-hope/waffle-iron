[workspace]
members = [
    "crates/waffle-types",
    "crates/kernel",
    "crates/sketch-solver",
    "crates/modeling-ops",
    "crates/feature-engine",
    "crates/wasm-bridge",
    "crates/file-format",
    "crates/test-harness",
]
exclude = ["archive"]
resolver = "2"

[patch.crates-io]
# Patched slvs: removed -x c++ -std=c++11 from bindgen clang args in build.rs.
# The header (slvs.h) is pure C; C++ mode causes bindgen to silently fail
# with newer libclang (only generates constants, skips structs/functions).
slvs = { path = "crates/slvs-patch/slvs-0.6.0" }

# Use panic=unwind so catch_unwind works on NATIVE targets.
# See .cargo/config.toml for WASM-specific settings.
[profile.release]
panic = "unwind"
