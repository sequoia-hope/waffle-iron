[workspace]
members = [
    "crates/waffle-types",
    "crates/sketch-solver",
    "crates/modeling-ops",
    "crates/feature-engine",
    "crates/wasm-bridge",
    "crates/file-format",
    "crates/test-harness",

    # Kernel stack (legacy `crates/kernel/` deleted at the Phase 6 migration,
    # 2026-06-11; kernel-v2 is THE kernel, behind the waffle-types traits).
    # Dependency layering (compiler-enforced via Cargo.toml deps):
    #   indirect-predicates-sidecar-rs (FFI; LGPL; non-WASM) — DEV-DEP oracle of cherchi-rs only (M7c)
    #   cad-primitives ← cherchi-rs ← cherchi-sidecar-rs (subprocess; non-WASM)
    #                                ← yang-rs ← kernel-v2
    #                  ← ssi-rs    ←
    "crates/cad-primitives",
    "crates/cherchi-rs",
    "crates/cherchi-sidecar-rs",
    "crates/indirect-predicates-sidecar-rs",
    "crates/ssi-rs",
    "crates/yang-rs",
    "crates/kernel-v2",

    # Dev tooling, OUTSIDE the kernel layering (no workspace deps, never
    # shipped): generates cherchi-rs's clean-room indirect-predicate
    # instances (M7) into src/predicates/indirect/generated.rs.
    "crates/predicate-gen",
]
exclude = ["archive"]
resolver = "2"

[patch.crates-io]
# Patched slvs: removed -x c++ -std=c++11 from bindgen clang args in build.rs.
# The header (slvs.h) is pure C; C++ mode causes bindgen to silently fail
# with newer libclang (only generates constants, skips structs/functions).
slvs = { path = "crates/slvs-patch/slvs-0.6.0" }

# Use panic=unwind so catch_unwind works on NATIVE targets.
# See .cargo/config.toml for WASM-specific settings.
[profile.release]
panic = "unwind"
